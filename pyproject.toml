[project]
name = "rag-english-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
ml = ["qdrant-client>=1.9", "FlagEmbedding>=1.2", "rank-bm25>=0.2", "ragas>=0.2", "mlflow>=2.14"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
