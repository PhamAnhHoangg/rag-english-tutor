[project]
name = "rag-english-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
# ml: what ingest and retrieval need (milestone 1-2)
ml = ["qdrant-client>=1.10", "fastembed>=0.4", "rank-bm25>=0.2"]
# m3: the large bge-m3 embedder, worth it with a GPU
m3 = ["FlagEmbedding>=1.2"]
# eval: experiment tracking and LLM-judged metrics (milestone 3).
# uvicorn has a floor because mlflow depends on it, and without one pip can backtrack
# to uvicorn 0.2.x, which hard-requires uvloop and fails to build on Windows.
eval = ["ragas>=0.2", "mlflow>=2.14", "uvicorn>=0.30"]
serve = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
